<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="windowClip">
      <rect x="2" y="2" width="60" height="60" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <!-- Ventana de Terminal Oscura -->
  <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="#0F172A" stroke="#000000" stroke-width="3.5"/>

  <!-- Barra de título de terminal -->
  <g clip-path="url(#windowClip)">
    <rect x="2" y="2" width="60" height="18" fill="#1E293B"/>
    <line x1="2" y1="20" x2="62" y2="20" stroke="#000000" stroke-width="2"/>
    
    <!-- Botones de ventana macOS / Linux (Rojo, Amarillo, Verde) -->
    <circle cx="11" cy="11" r="3.2" fill="#FF5F56" stroke="#E0443E" stroke-width="0.8"/>
    <circle cx="20" cy="11" r="3.2" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.8"/>
    <circle cx="29" cy="11" r="3.2" fill="#27C93F" stroke="#1AAB29" stroke-width="0.8"/>
  </g>

  <!-- Prompt de código '>_' en Verde Lima Neo-brutalista -->
  <path d="M14 30 L26 39 L14 48" fill="none" stroke="#C4F135" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="32" y="44" width="16" height="5" rx="1.5" fill="#C4F135"/>
</svg>
